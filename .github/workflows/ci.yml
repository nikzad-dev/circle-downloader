name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  rust:
    name: Rust (${{ matrix.os }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            fmt-check: true
          - os: ubuntu-22.04
            fmt-check: true
          - os: windows-latest
            fmt-check: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eece3 # v2.7.7
        with:
          workspaces: 'src-tauri -> src-tauri/target'

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Rust formatting check
        if: matrix.fmt-check == true
        run: bun run fmt:rust

      - run: bun run clippy:rust
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets
