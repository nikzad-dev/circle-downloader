[package]
name = "circle-downloader"
version = "0.1.0"
description = "A local-first desktop download manager"
license = "GPL-3.0-or-later"
authors = [ "Alireza Nikzad" ]
edition = "2024"

[lib]
name = "circle_downloader_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon" ] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
  "time"
] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream"
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12"
] }
futures-util = "0.3"
uuid = { version = "1", features = [
  "v4",
  "serde"
] }
chrono = { version = "0.4", features = [
  "serde",
  "clock"
] }
url = "2"
rusqlite = { version = "0.32", features = [ "bundled" ] }
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
dirs = "6"
cap-std = "4"
cap-fs-ext = "4"
same-file = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = [
  "full",
  "net",
  "io-util"
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12"
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
